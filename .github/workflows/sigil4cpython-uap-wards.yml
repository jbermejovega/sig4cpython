name: SIGIL4CPython UAP Wards

on:
  workflow_dispatch:
  push:
    paths:
      - 'Lib/sigil4cpython/**'
      - 'Lib/test/test_sigil4cpython_uap_wards.py'
      - 'Doc/library/sigil4cpython.rst'
      - '.github/workflows/sigil4cpython-uap-wards.yml'
  pull_request:
    paths:
      - 'Lib/sigil4cpython/**'
      - 'Lib/test/test_sigil4cpython_uap_wards.py'
      - 'Doc/library/sigil4cpython.rst'
      - '.github/workflows/sigil4cpython-uap-wards.yml'

permissions:
  contents: read

jobs:
  uap-wards:
    name: Validate SIGIL4CPython UAP wards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run UAP ward tests
        run: |
          python - <<'PY'
          import sys
          import unittest

          # Append the experimental package after Python has initialized its own
          # standard library. PYTHONPATH=Lib would shadow the runner stdlib with
          # the CPython source checkout.
          sys.path.append('Lib')
          suite = unittest.defaultTestLoader.discover(
              'Lib/test', pattern='test_sigil4cpython_uap_wards.py'
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Safe boundary notice
        run: |
          echo "SIGIL4CPython UAP wards validated."
          echo "This CI validates metadata guardrails only."
          echo "It does not change or certify CPython interpreter semantics."
