name: SIGIL4CPython UAP Wards

on:
  workflow_dispatch:
  push:
    paths:
      - 'Lib/sigil4cpython/**'
      - 'Lib/test/test_sigil4cpython_uap_wards.py'
      - 'Doc/library/sigil4cpython.rst'
      - '.github/workflows/sigil4cpython-uap-wards.yml'
  pull_request:
    paths:
      - 'Lib/sigil4cpython/**'
      - 'Lib/test/test_sigil4cpython_uap_wards.py'
      - 'Doc/library/sigil4cpython.rst'
      - '.github/workflows/sigil4cpython-uap-wards.yml'

permissions:
  contents: read

jobs:
  uap-wards:
    name: Validate SIGIL4CPython UAP wards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Run UAP ward tests
        id: uap_tests
        continue-on-error: true
        run: |
          python - <<'PY' > uap-ward-tests.log 2>&1
          import runpy
          import sys

          # Append the experimental package after Python has initialized its own
          # standard library. Running the file directly avoids discovery rules
          # tied to the CPython source checkout.
          sys.path.append('Lib')
          sys.argv = ['Lib/test/test_sigil4cpython_uap_wards.py', '-v']
          runpy.run_path(
              'Lib/test/test_sigil4cpython_uap_wards.py',
              run_name='__main__',
          )
          PY
          cat uap-ward-tests.log

      - name: Upload UAP diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sigil4cpython-uap-ward-test-log
          path: uap-ward-tests.log
          if-no-files-found: warn
          archive: false

      - name: Fail on UAP obstruction
        if: steps.uap_tests.outcome != 'success'
        run: |
          echo 'SIGIL4CPython UAP ward tests retained an obstruction.'
          exit 1

      - name: Safe boundary notice
        run: |
          echo "SIGIL4CPython UAP wards validated."
          echo "This CI validates metadata guardrails only."
          echo "It does not change or certify CPython interpreter semantics."
